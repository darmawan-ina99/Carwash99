<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CuciBersih - Manajemen Cucian</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        // TODO: Ganti dengan firebaseConfig milik Anda!
        const firebaseConfig = {
            apiKey: "AIzaSyCFXSdwMp3WaUDGeYj2m4Q-l49TYs_LRR0",
            authDomain: "carwash-99.firebaseapp.com",
            projectId: "carwash-99",
            storageBucket: "carwash-99.firebasestorage.app",
            messagingSenderId: "617166626443",
            appId: "1:617166626443:web:b030f30fd51c3b8eb2fe8e"
        };
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        console.log("Firebase siap!");
        
        // ============ STATE GLOBAL ============
        let currentUser = null;
        let layananList = [];
        let tukangList = [];
        
        // ============ DOM Elements ============
        let authScreen, appScreen, userNameSpan;
        
        // ============ AUTHENTICATION ============
        function showAuthScreen() {
            authScreen.style.display = "flex";
            appScreen.style.display = "none";
        }
        
        function showAppScreen() {
            authScreen.style.display = "none";
            appScreen.style.display = "block";
            loadUserData();
        }
        
        async function handleLogin(email, password) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Login berhasil!");
                showAppScreen();
            } catch (error) {
                alert("Login gagal: " + error.message);
            }
        }
        
        async function handleRegister(email, password) {
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Registrasi berhasil! Silakan login.");
            } catch (error) {
                alert("Registrasi gagal: " + error.message);
            }
        }
        
        async function handleLogout() {
            await signOut(auth);
            showAuthScreen();
        }
        
        // ============ LOAD DATA ============
        async function loadUserData() {
            if (!currentUser) return;
            userNameSpan.textContent = currentUser.email;
            await loadLayanan();
            await loadTukang();
            renderDashboard();
        }
        
        async function loadLayanan() {
            const q = query(collection(db, "users", currentUser.uid, "layanan"));
            const snapshot = await getDocs(q);
            layananList = [];
            snapshot.forEach(doc => {
                layananList.push({ id: doc.id, ...doc.data() });
            });
            renderLayananList();
            renderTransaksiButtons();
        }
        
        async function loadTukang() {
            const q = query(collection(db, "users", currentUser.uid, "tukang"));
            const snapshot = await getDocs(q);
            tukangList = [];
            snapshot.forEach(doc => {
                tukangList.push({ id: doc.id, ...doc.data() });
            });
            renderTukangList();
        }
        
        // ============ RENDER DASHBOARD ============
        function renderDashboard() {
            // Sederhana untuk MVP
            document.getElementById("dashboardContent").innerHTML = `
                <div class="bg-white rounded-xl p-4 shadow">
                    <h3 class="font-bold text-lg mb-2">📊 Ringkasan Hari Ini</h3>
                    <p class="text-gray-500 text-sm">Fitur dashboard lengkap sedang dalam pengembangan...</p>
                    <p class="text-gray-600 mt-2">Total layanan: ${layananList.length}</p>
                    <p class="text-gray-600">Total tukang: ${tukangList.length}</p>
                </div>
            `;
        }
        
        // ============ RENDER LAYANAN ============
        function renderLayananList() {
            const container = document.getElementById("layananList");
            if (!container) return;
            if (layananList.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">Belum ada layanan. Tambahkan layanan dulu.</p>';
                return;
            }
            container.innerHTML = layananList.map(l => `
                <div class="bg-gray-50 rounded-lg p-3 mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold">${l.nama}</p>
                        <p class="text-sm text-gray-600">Harga: Rp${l.harga.toLocaleString()} | Jasa tukang: Rp${l.jasaTukang.toLocaleString()}</p>
                    </div>
                    <button onclick="hapusLayanan('${l.id}')" class="text-red-500 text-sm">Hapus</button>
                </div>
            `).join('');
        }
        
        function renderTransaksiButtons() {
            const container = document.getElementById("transaksiButtons");
            if (!container) return;
            if (layananList.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">Tambahkan layanan dulu untuk mulai transaksi</p>';
                return;
            }
            container.innerHTML = layananList.map(l => `
                <button onclick="pilihLayanan('${l.id}', '${l.nama}', ${l.harga}, ${l.jasaTukang})" 
                    class="bg-blue-600 text-white py-4 rounded-xl text-xl font-bold active:bg-blue-700 transition">
                    🧼 ${l.nama}<br>
                    <span class="text-sm opacity-90">Rp${l.harga.toLocaleString()}</span>
                </button>
            `).join('');
        }
        
        window.pilihLayanan = function(layananId, nama, harga, jasaTukang) {
            if (tukangList.length === 0) {
                alert("Tambahkan tukang cuci dulu!");
                return;
            }
            // Tampilkan pilihan tukang
            let tukangOption = prompt(`Pilih tukang untuk ${nama}:\n${tukangList.map((t, i) => `${i+1}. ${t.nama}`).join('\n')}\n\nMasukkan nomor:`);
            let index = parseInt(tukangOption) - 1;
            if (index >= 0 && index < tukangList.length) {
                catatTransaksi(layananId, nama, harga, jasaTukang, tukangList[index].id, tukangList[index].nama);
            } else {
                alert("Pilihan tidak valid");
            }
        };
        
        async function catatTransaksi(layananId, namaLayanan, harga, jasaTukang, tukangId, namaTukang) {
            if (!currentUser) return;
            try {
                await addDoc(collection(db, "users", currentUser.uid, "transaksi"), {
                    layananId: layananId,
                    namaLayanan: namaLayanan,
                    harga: harga,
                    jasaTukang: jasaTukang,
                    tukangId: tukangId,
                    namaTukang: namaTukang,
                    tanggal: new Date().toISOString().split('T')[0],
                    timestamp: Timestamp.now()
                });
                alert("Transaksi berhasil dicatat!");
                // Optional: refresh dashboard
            } catch (error) {
                alert("Gagal mencatat transaksi: " + error.message);
            }
        }
        
        window.hapusLayanan = async function(id) {
            if (confirm("Hapus layanan ini?")) {
                await deleteDoc(doc(db, "users", currentUser.uid, "layanan", id));
                loadLayanan();
            }
        };
        
        async function tambahLayanan(nama, harga, jasaTukang) {
            if (!currentUser) return;
            await addDoc(collection(db, "users", currentUser.uid, "layanan"), {
                nama: nama,
                harga: parseInt(harga),
                jasaTukang: parseInt(jasaTukang),
                createdAt: Timestamp.now()
            });
            loadLayanan();
        }
        
        async function tambahTukang(nama) {
            if (!currentUser) return;
            await addDoc(collection(db, "users", currentUser.uid, "tukang"), {
                nama: nama,
                aktif: true,
                tanggalGabung: new Date().toISOString().split('T')[0]
            });
            loadTukang();
        }
        
        window.hapusTukang = async function(id) {
            if (confirm("Hapus tukang ini?")) {
                await deleteDoc(doc(db, "users", currentUser.uid, "tukang", id));
                loadTukang();
            }
        };
        
        function renderTukangList() {
            const container = document.getElementById("tukangList");
            if (!container) return;
            if (tukangList.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">Belum ada tukang. Tambahkan tukang dulu.</p>';
                return;
            }
            container.innerHTML = tukangList.map(t => `
                <div class="bg-gray-50 rounded-lg p-3 mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold">${t.nama}</p>
                        <p class="text-sm text-gray-600">Bergabung: ${t.tanggalGabung}</p>
                    </div>
                    <button onclick="hapusTukang('${t.id}')" class="text-red-500 text-sm">Hapus</button>
                </div>
            `).join('');
        }
        
        // Event listeners untuk form
        window.initEventListeners = function() {
            document.getElementById("loginBtn").onclick = () => {
                const email = document.getElementById("loginEmail").value;
                const password = document.getElementById("loginPassword").value;
                handleLogin(email, password);
            };
            document.getElementById("registerBtn").onclick = () => {
                const email = document.getElementById("registerEmail").value;
                const password = document.getElementById("registerPassword").value;
                handleRegister(email, password);
            };
            document.getElementById("logoutBtn").onclick = handleLogout;
            document.getElementById("tambahLayananBtn").onclick = () => {
                let nama = prompt("Nama layanan (contoh: Cuci Motor):");
                let harga = prompt("Harga untuk konsumen (contoh: 15000):");
                let jasa = prompt("Jasa untuk tukang (contoh: 5000):");
                if (nama && harga && jasa) tambahLayanan(nama, harga, jasa);
            };
            document.getElementById("tambahTukangBtn").onclick = () => {
                let nama = prompt("Nama tukang:");
                if (nama) tambahTukang(nama);
            };
        };
        
        // Auth state listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                showAppScreen();
            } else {
                showAuthScreen();
            }
        });
        
        // DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            authScreen = document.getElementById("authScreen");
            appScreen = document.getElementById("appScreen");
            userNameSpan = document.getElementById("userName");
            initEventListeners();
        });
    </script>
</head>
<body class="bg-gray-100">
    
    <!-- LAYAR LOGIN/REGISTER -->
    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🧼 CuciBersih</h1>
            
            <!-- Login Form -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-3">Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" class="w-full border rounded-lg p-2 mb-2">
                <input type="password" id="loginPassword" placeholder="Password" class="w-full border rounded-lg p-2 mb-2">
                <button id="loginBtn" class="bg-blue-600 text-white w-full py-2 rounded-lg font-semibold">Login</button>
            </div>
            
            <hr class="my-4">
            
            <!-- Register Form -->
            <div>
                <h2 class="text-lg font-semibold mb-3">Daftar Baru</h2>
                <input type="email" id="registerEmail" placeholder="Email" class="w-full border rounded-lg p-2 mb-2">
                <input type="password" id="registerPassword" placeholder="Password" class="w-full border rounded-lg p-2 mb-2">
                <button id="registerBtn" class="bg-green-600 text-white w-full py-2 rounded-lg font-semibold">Daftar</button>
            </div>
        </div>
    </div>
    
    <!-- LAYAR APLIKASI UTAMA -->
    <div id="appScreen" class="max-w-md mx-auto pb-20" style="display: none;">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-10">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold">🧼 CuciBersih</h1>
                <button id="logoutBtn" class="bg-blue-700 px-3 py-1 rounded text-sm">Logout</button>
            </div>
            <p class="text-sm opacity-90 mt-1">Halo, <span id="userName"></span></p>
        </div>
        
        <!-- Tombol Transaksi Cepat -->
        <div class="p-4">
            <h2 class="font-bold mb-2">📝 Transaksi Cepat</h2>
            <div id="transaksiButtons" class="grid grid-cols-2 gap-3">
                <!-- tombol dinamis dari layanan -->
            </div>
        </div>
        
        <!-- TABS (sederhana) -->
        <div class="border-b border-gray-200 px-4">
            <div class="flex gap-4">
                <button class="tab-btn py-2 text-blue-600 border-b-2 border-blue-600" data-tab="dashboard">Dashboard</button>
                <button class="tab-btn py-2 text-gray-500" data-tab="layanan">Layanan</button>
                <button class="tab-btn py-2 text-gray-500" data-tab="tukang">Tukang</button>
            </div>
        </div>
        
        <!-- Konten Tab -->
        <div class="p-4">
            <div id="tabDashboard" class="tab-content">
                <div id="dashboardContent"></div>
            </div>
            <div id="tabLayanan" class="tab-content" style="display: none;">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold">📋 Daftar Layanan</h2>
                    <button id="tambahLayananBtn" class="bg-green-600 text-white px-3 py-1 rounded text-sm">+ Tambah</button>
                </div>
                <div id="layananList"></div>
            </div>
            <div id="tabTukang" class="tab-content" style="display: none;">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold">👨‍🔧 Daftar Tukang</h2>
                    <button id="tambahTukangBtn" class="bg-green-600 text-white px-3 py-1 rounded text-sm">+ Tambah</button>
                </div>
                <div id="tukangList"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Simple tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
                document.getElementById(`tab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`).style.display = 'block';
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                    b.classList.add('text-gray-500');
                });
                btn.classList.remove('text-gray-500');
                btn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                
                if (tabName === 'dashboard') renderDashboard();
            });
        });
        
        window.renderDashboard = () => {
            const container = document.getElementById("dashboardContent");
            if (container) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-4 shadow">
                        <h3 class="font-bold text-lg mb-2">📊 Ringkasan</h3>
                        <p class="text-gray-500 text-sm">Total layanan: ${layananList.length}</p>
                        <p class="text-gray-500 text-sm">Total tukang: ${tukangList.length}</p>
                        <p class="text-gray-500 text-sm mt-2 text-center">✨ Transaksi akan muncul di sini ✨</p>
                    </div>
                `;
            }
        };
    </script>
</body>
          </html>
